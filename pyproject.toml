[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "syncmoss"
dynamic = ["version"]
description = "SYNCmoss — Mössbauer spectroscopy analysis application"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Sergey Yaroslavtsev"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "PySide6",
    "numba",
    "llvmlite",
]

[project.urls]
Homepage = "https://github.com/sergey-yaroslavtsev/syncmoss"
Repository = "https://github.com/sergey-yaroslavtsev/syncmoss"

[project.scripts]
# console script (not gui-scripts): on Windows this uses the python.exe launcher
# so the app stays attached to the calling terminal and its stdout/stderr are visible.
syncmoss = "syncmoss.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["syncmoss*"]

[tool.setuptools.package-dir]
syncmoss = "syncmoss"

[tool.setuptools.dynamic]
version = { attr = "syncmoss.main.__VERSION__" }

[tool.setuptools.package-data]
syncmoss = [
    "icons/*.png",
    "icons/*.ico",
    "icons/*.svg",
    "parameters/*.txt",
    "parameters/*.dat",
    "parameters/*.png",
    "parameters/*.md",
    "*.json",
    "*.dat",
]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n 6: almost every test here spends its time in ONE process doing physics
# (a fit, a calibration, an instrumental-function search), so a serial run
# leaves most of the machine idle -- measured 351 s serial against 116 s on 8
# workers for the calibration + instrumental set.
#
# A FIXED 6, not "auto". Each worker builds its own QApplication, PhysicsApp
# and numba-compiled model, so the suite is limited by MEMORY, not by cores:
# "auto" resolves to one worker per core (22 here) and dies during start-up
# with an execnet EOFError once the machine runs out. The same ceiling bit the
# 83-spectrum study, where 10 parallel fits OOM'd and 6 did not.
#
# CI overrides this with -n 0 (see .github/workflows/_Tests.yml): the runners
# are small, where even 6 oversubscribes. Use -n 0 locally too when debugging,
# since xdist swallows live output.
addopts = "-q --basetemp=./.pytest_tmp -n 6"
markers = [
    "gui: builds the PySide6 GUI; runs head-less via QT_QPA_PLATFORM=offscreen (set in tests/conftest.py)",
    "slow: slow tests (numba compilation / fitting)",
]
