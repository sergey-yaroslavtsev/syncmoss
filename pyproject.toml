[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "syncmoss"
dynamic = ["version"]
description = "SYNCmoss — Mössbauer spectroscopy analysis application"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Sergey Yaroslavtsev"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "PySide6",
    "numba",
    "llvmlite",
]

[project.urls]
Homepage = "https://github.com/sergey-yaroslavtsev/syncmoss"
Repository = "https://github.com/sergey-yaroslavtsev/syncmoss"

[project.scripts]
# console script (not gui-scripts): on Windows this uses the python.exe launcher
# so the app stays attached to the calling terminal and its stdout/stderr are visible.
syncmoss = "syncmoss.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["syncmoss*"]

[tool.setuptools.package-dir]
syncmoss = "syncmoss"

[tool.setuptools.dynamic]
version = { attr = "syncmoss.main.__VERSION__" }

[tool.setuptools.package-data]
syncmoss = [
    "icons/*.png",
    "icons/*.ico",
    "icons/*.svg",
    "parameters/*.txt",
    "parameters/*.dat",
    "parameters/*.png",
    "parameters/*.md",
    "*.json",
    "*.dat",
]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default: almost every test spends its time in ONE process doing
# physics or building a window, so a serial run leaves most of the machine idle.
#
# -n auto does NOT mean one worker per core here: tests/conftest.py answers it
# with tests/worker_plan.py, which takes as many workers as the memory
# available NOW (minus what stays free for the rest of the machine), the idle
# processors and the amount of selected work allow, using the time and memory
# per test measured in tests/resource_profile.json. The first output line says
# what it chose and why; the last one the peak memory the run really took.
# -n N still forces N; PYTEST_XDIST_AUTO_NUM_WORKERS=N does the same for auto.
#
# --dist loadgroup --no-loadscope-reorder: the workers hand the tests out in
# the order conftest gives them, longest first, so the long tests start at once
# and the short ones fill in at the end; tests sharing an xdist_group mark (one
# expensive module fixture) run on one worker instead of each worker redoing it.
#
# CI overrides this with -n 0 (see .github/workflows/_Tests.yml): the runners
# are small. Use -n 0 locally too when debugging, since xdist swallows live
# output.
addopts = "-q -n auto --dist loadgroup --no-loadscope-reorder"
markers = [
    "gui: builds the PySide6 GUI; runs head-less via QT_QPA_PLATFORM=offscreen (set in tests/conftest.py)",
    "slow: slow tests (numba compilation / fitting)",
]
